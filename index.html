<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REALTECH Cyber</title>

  <!-- Security / CSP meta tags -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://formspree.io; style-src 'self' 'unsafe-inline';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">

</head>
<body>
  <h1>Contact REALTECH Cyber</h1>

 <form action="https://formspree.io/f/xgovkzgn" method="POST">
  <label>
    Your email:
    <input type="email" name="email" required>
  </label>
  <label>
    Your message:
    <textarea name="message" required></textarea>
  </label>
  <input type="hidden" name="_next" value="https://wesleymonubi.github.io/realtech-consultants/">
  <button type="submit">Send</button>
</form>


  <div id="formMessage" style="display:none; margin-top:1em; color:green;">
    Your message has been sent successfully!
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e){
      e.preventDefault();

      const form = e.target;
      const url = "https://formspree.io/f/xgovkzgn"; // Correct endpoint
      const data = new FormData(form);

      fetch(url, {
        method: "POST",
        body: data,
        headers: { "Accept": "application/json" }
      })
      .then(response => {
        if(response.ok){
          form.reset();
          document.getElementById("formMessage").style.display = "block";
        } else {
          alert("Oops! There was a problem submitting your form.");
        }
      })
      .catch(error => {
        alert("Oops! There was a problem submitting your form.");
      });
    });
  </script>

</body>
</html>
