<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REALTECH Cyber</title>

  <!-- Security / CSP meta tags -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://formspree.io; style-src 'self' 'unsafe-inline';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">

</head>
<body>
  <h1>Contact REALTECH Cyber</h1>

  <form id="contactForm" method="POST">
    <label>
      Name
      <input type="text" name="name" placeholder="Your Name" required>
    </label>

    <label>
      Email
      <input type="email" name="email" placeholder="Your Email" required>
    </label>

    <label>
      Message
      <textarea name="message" placeholder="Your Message" required></textarea>
    </label>

    <!-- Hidden fields for Formspree -->
    <input type="hidden" name="_subject" value="New REALTECH Cyber Inquiry">
    <input type="hidden" name="_next" value="https://wesleymonubi.github.io/realtech-consultants/">
    <input type="text" name="_gotcha" style="display:none">

    <button type="submit">Send Message</button>
  </form>

  <div id="formMessage" style="display:none; margin-top:1em; color:green;">
    Your message has been sent successfully!
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e){
      e.preventDefault();

      const form = e.target;
      const url = "https://formspree.io/f/xgovkzgn"; // Correct endpoint
      const data = new FormData(form);

      fetch(url, {
        method: "POST",
        body: data,
        headers: { "Accept": "application/json" }
      })
      .then(response => {
        if(response.ok){
          form.reset();
          document.getElementById("formMessage").style.display = "block";
        } else {
          alert("Oops! There was a problem submitting your form.");
        }
      })
      .catch(error => {
        alert("Oops! There was a problem submitting your form.");
      });
    });
  </script>

</body>
</html>
